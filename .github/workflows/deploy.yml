name: Deploy

# Builds Docker images for backend + admin, pushes them to GitHub Container
# Registry (ghcr.io), then updates the server over SSH.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST      server IP / hostname
#   SSH_USER      e.g. root
#   SSH_KEY       private key whose public key is in the server's authorized_keys
#   (run deploy.sh by hand once first; after that every push to main deploys)
#   SSH_PORT      optional, defaults to 22
# Repository variables (optional):
#   API_DOMAIN     default api.wheellol.com      (baked into the admin build)
#   SOCKET_DOMAIN  default socket.wheellol.com   (baked into the admin build)
#   DEPLOY_PATH    default /opt/wheellol
#
# Until SSH_HOST is set, the images are still built and pushed, and the
# server step is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.names.outputs.backend }}
      admin_image: ${{ steps.names.outputs.admin }}
    steps:
      - uses: actions/checkout@v4

      - id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "backend=${REGISTRY}/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "admin=${REGISTRY}/${repo}-admin" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:latest
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push admin
        uses: docker/build-push-action@v6
        with:
          context: admin
          push: true
          build-args: |
            VITE_API_URL=https://${{ vars.API_DOMAIN || 'api.wheellol.com' }}/
            VITE_SOCKET_URL=https://${{ vars.SOCKET_DOMAIN || 'socket.wheellol.com' }}
          tags: |
            ${{ steps.names.outputs.admin }}:latest
            ${{ steps.names.outputs.admin }}:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/wheellol' }}
    steps:
      - name: Skip notice
        if: env.SSH_HOST == ''
        run: echo "::notice::SSH_HOST secret not set - images pushed, server deploy skipped."

      - name: Deploy with deploy.sh
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG,DEPLOY_PATH
          script: |
            set -e
            if [ ! -f "$DEPLOY_PATH/.env" ] || [ ! -f "$DEPLOY_PATH/deploy.sh" ]; then
              echo "::error::Run deploy.sh once on the server first (see README: Production)."
              exit 1
            fi
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo -E"
            # YES=1: no questions. Same steps as by hand: code, images (this commit's tag),
            # migration check, DB backup, restart, HTTPS check.
            $SUDO env YES=1 APP_DIR="$DEPLOY_PATH" IMAGE_TAG="$IMAGE_TAG" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" \
              bash "$DEPLOY_PATH/deploy.sh" setup
            docker logout ghcr.io >/dev/null 2>&1 || true
