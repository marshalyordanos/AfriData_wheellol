# Production stack. On the server this file sits next to Caddyfile and .env
# (copy .env.example -> .env and fill it in). CI copies this file + Caddyfile
# to the server on every deploy and runs `docker compose pull && up -d`.

name: wheellol

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wheellol}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-wheellol}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${BACKEND_IMAGE:-wheellol-backend}:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wheellol}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wheellol}?schema=public
      REDIS_URL: redis://redis:6379
      GATEWAY_PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  admin:
    image: ${ADMIN_IMAGE:-wheellol-admin}:${IMAGE_TAG:-latest}
    build:
      context: ./admin
      args:
        VITE_API_URL: https://${API_DOMAIN}/
        VITE_SOCKET_URL: https://${SOCKET_DOMAIN}
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      SOCKET_DOMAIN: ${SOCKET_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - admin
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
